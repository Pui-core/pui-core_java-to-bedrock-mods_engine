// 自作 fixture MOD。互換エンジンの検証対象として、非バニラのアイテムとブロックを最小構成で登録する。
// Minecraft 本体を取得するため、ルートのビルドとは分けた独立ビルドにしている。
plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

version = project.mod_version
group = 'dev.puicore.modbridge'
base { archivesName = 'pmb-fabric-fixture' }

def rootProperties = new Properties()
file('../../gradle.properties').withInputStream { rootProperties.load(it) }

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
	compileOnly('dev.puicore.modbridge:core:' + rootProperties.getProperty('version')) { transitive = false }
}

processResources {
	def version = project.version
	inputs.property 'version', version
	filesMatching('fabric.mod.json') { expand 'version': version }
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
	it.options.encoding = 'UTF-8'
}

tasks.withType(AbstractArchiveTask).configureEach {
	preserveFileTimestamps = false
	reproducibleFileOrder = true
}
