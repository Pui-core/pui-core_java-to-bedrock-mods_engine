// 実行時レジストリの取得 MOD（Mode A 用）。Fabric 専用サーバーで、MOD が実際に登録したアイテム・ブロック・レシピを JSON に書き出す。
// Minecraft 本体を取得するため、ルートのビルドとは分けた独立ビルドにしている（fixtures/fabric-fixture と同じ構成）。
plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

version = project.mod_version
group = 'dev.puicore.modbridge'
base { archivesName = 'modbridge-registry-dump' }

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	// 使うのはサーバーのライフサイクルイベントだけ
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
}

processResources {
	def version = project.version
	inputs.property 'version', version
	filesMatching('fabric.mod.json') { expand 'version': version }
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
	it.options.encoding = 'UTF-8'
	it.options.compilerArgs += ['-Xlint:all', '-Xlint:-processing', '-Xlint:-classfile']
}

tasks.withType(AbstractArchiveTask).configureEach {
	preserveFileTimestamps = false
	reproducibleFileOrder = true
}
