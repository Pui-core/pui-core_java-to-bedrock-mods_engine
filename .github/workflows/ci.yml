name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build (${{ matrix.os }}, JDK ${{ matrix.java }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        java: ['25']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: gradle/actions/wrapper-validation@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew build --no-daemon
        shell: bash
      - run: ./gradlew :cli:run --args=doctor --no-daemon -q
        shell: bash
      - run: node --test scripts/test-bedrock-machine-menus.mjs

  fixture:
    name: fixture MOD と Fabric サーバー用 MOD (Fabric MC 26.3)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: バージョンカタログと fixture の版を照合
        run: |
          set -eu
          cat_val() { sed -n "s/^$1 = \"\(.*\)\"$/\1/p" gradle/libs.versions.toml; }
          prop_val() { sed -n "s/^$2=//p" "$1/gradle.properties"; }
          fail=0
          for dir in fixtures/fabric-fixture platform-fabric; do
            for pair in minecraft:minecraft_version fabric-loader:loader_version fabric-api:fabric_api_version fabric-loom:loom_version; do
              c="$(cat_val "${pair%%:*}")"; f="$(prop_val "$dir" "${pair##*:}")"
              if [ "$c" != "$f" ]; then echo "不一致: ${pair%%:*} catalog=$c $dir=$f"; fail=1; fi
            done
          done
          sp_val() { sed -n "s/^$1=//p" scripts/spike-server.sh; }
          [ "$(sp_val MC)" = "$(cat_val minecraft)" ] || { echo "不一致: spike MC"; fail=1; }
          [ "$(sp_val LOADER)" = "$(cat_val fabric-loader)" ] || { echo "不一致: spike LOADER"; fail=1; }
          root_ver="$(sed -n 's/^version=//p' gradle.properties)"
          [ "$(prop_val platform-fabric core_version)" = "$root_ver" ] || { echo "不一致: core_version と version"; fail=1; }
          [ "$(prop_val platform-fabric mod_version)" = "$root_ver" ] || { echo "不一致: mod_version と version"; fail=1; }
          exit $fail
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew build --no-daemon
        working-directory: fixtures/fabric-fixture
      - run: ./gradlew build --no-daemon
        working-directory: platform-fabric
      - uses: actions/upload-artifact@v4
        with:
          name: fabric-mods
          path: |
            fixtures/fabric-fixture/build/libs/*.jar
            platform-fabric/build/libs/*.jar
          retention-days: 14
